services:
  - type: web
    name: secure-scope
    runtime: python
    buildCommand: pip install -r requirements.txt
    # The app uses Flask-SocketIO in async_mode="threading" and runs each scan
    # in its own background thread, so it needs a threaded WSGI worker (gthread),
    # NOT an eventlet/gevent worker. Bind to Render's $PORT. A single worker with
    # several threads suits the free 0.5-CPU instance; the long timeout covers
    # slow long-poll transports.
    startCommand: gunicorn -k gthread -w 1 --threads 8 --timeout 120 --bind 0.0.0.0:$PORT ui.server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
